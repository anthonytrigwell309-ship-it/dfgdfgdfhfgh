name: GiveawayGUI
version: '1.0.0'
main: com.yourserver.giveaway.GiveawayPlugin
api-version: '26.3'
folia-supported: true
author: YourServer
description: Item and key giveaways with a GUI entry menu.

commands:
  giveawaygui:
    description: Manage item giveaways (admin only)
    usage: "/giveawaygui [add [time]|cancel|info]"
    permission: giveaway.admin
    permission-message: '&cYou do not have permission to manage giveaways.'
  giveaway:
    description: View and join the current giveaway, or manage key giveaways (admin)
    usage: "/giveaway [admin|adminkeyadd|adminkeyremove|adminkeylist]"
    aliases: ["giveaway.adminkeyadd"]

permissions:
  giveaway.admin:
    description: Allows managing giveaways and opening the admin key menu
    default: op
    children:
      giveaway.adminkeyadd: true
  giveaway.adminkeyadd:
    description: Allows creating, removing and listing key prizes
    default: op
